name: Deploy

# Deploys the OpenCut Workers to Cloudflare.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   CLOUDFLARE_API_TOKEN   API token with "Account / Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  32-character hex account id from the Cloudflare dashboard
#
# Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   WORKER_NAME_WEB    Override the web Worker name.        Default: opencut-web
#   WORKER_NAME_API    Override the api Worker name.        Default: opencut-api
#   WEB_CUSTOM_DOMAIN  Custom domain for the web Worker.
#                      Defaults to `none`, which drops the `new.opencut.app`
#                      route committed in apps/web/wrangler.jsonc and serves the
#                      Worker from your account's *.workers.dev subdomain
#                      instead. A fork does not own opencut.app, so deploying
#                      that route as committed fails. Set this to a domain you
#                      control (e.g. cut.example.com) to attach it, or to
#                      `new.opencut.app` when deploying OpenCut's own production.
#   API_CUSTOM_DOMAIN  Optional custom domain for the api Worker. Unset by
#                      default, which leaves apps/api/wrangler.jsonc untouched.
#
# See DEPLOY.md for the full walkthrough.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        default: all
        options: [all, web, api]
      worker_domain:
        description: 'Custom domain for the web Worker (overrides WEB_CUSTOM_DOMAIN; "none" = workers.dev)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'scripts/apply-deploy-config.mjs'
      - '.github/workflows/deploy.yml'

# Never cancel an in-flight production deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in sync with the bun pin in .prototools.
  BUN_VERSION: '1.3.11'

jobs:
  web:
    name: Deploy web Worker
    if: >-
      ${{ github.event_name == 'push'
          || github.event.inputs.target == 'all'
          || github.event.inputs.target == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set. See DEPLOY.md."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The CLOUDFLARE_ACCOUNT_ID repository secret is not set. See DEPLOY.md."
            missing=1
          fi
          exit "$missing"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      # Runs before the build: @cloudflare/vite-plugin reads apps/web/wrangler.jsonc
      # at build time and bakes the result into dist/server/wrangler.json.
      - name: Target this Cloudflare account
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME_WEB }}
          WORKER_DOMAIN: ${{ github.event.inputs.worker_domain || vars.WEB_CUSTOM_DOMAIN || 'none' }}
        run: node scripts/apply-deploy-config.mjs apps/web/wrangler.jsonc

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

  api:
    name: Deploy api Worker
    if: >-
      ${{ github.event_name == 'push'
          || github.event.inputs.target == 'all'
          || github.event.inputs.target == 'api' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set. See DEPLOY.md."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The CLOUDFLARE_ACCOUNT_ID repository secret is not set. See DEPLOY.md."
            missing=1
          fi
          exit "$missing"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: apps/api
        run: bun install --frozen-lockfile

      - name: Target this Cloudflare account
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME_API }}
          WORKER_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN }}
        run: node scripts/apply-deploy-config.mjs apps/api/wrangler.jsonc

      - name: Deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
